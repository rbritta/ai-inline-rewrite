name: CI

# Windows only: the app is WPF + WinForms (net11.0-windows10.0.19041.0). The tests are a plain net11.0 project that links the pure
# source files and the engine clients, so they need no desktop runtime, no Ollama and no Anthropic key.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          # no NuGet cache: setup-dotnet caches from packages.lock.json files, which this repo does not keep

      - name: Build
        run: dotnet build AiInlineRewrite.sln -c Release --nologo

      - name: Test with coverage
        run: dotnet test tests/AiInlineRewrite.Tests/AiInlineRewrite.Tests.csproj -c Release --no-build --verbosity normal --collect "Code Coverage;Format=cobertura" --results-directory TestResults

      - name: Coverage summary
        shell: pwsh
        run: ./tools/coverage-summary.ps1 -Path TestResults

      - name: Publish (self-contained folder)
        run: dotnet publish src/AiInlineRewrite/AiInlineRewrite.csproj -p:PublishProfile=win-x64 --nologo

      - name: Upload the app folder
        uses: actions/upload-artifact@v7
        with:
          name: AiInlineRewrite-win-x64
          path: artifacts/publish/win-x64/
          if-no-files-found: error
