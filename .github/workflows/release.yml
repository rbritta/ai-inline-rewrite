name: release

# Tag a commit `vX.Y.Z` (the <Version> in src/AiInlineRewrite/AiInlineRewrite.csproj) to build the self-contained
# exe and publish it as a GitHub Release whose notes are the CHANGELOG section of that version.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Release notes (the tag must name the version)
        shell: pwsh
        run: |
          ./tools/release-notes.ps1 -Tag $env:GITHUB_REF_NAME -OutFile release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $footer = "`n---`n`nDownload ``AiInlineRewrite-$env:GITHUB_REF_NAME-win-x64.zip`` below, unzip it anywhere and run ``AiInlineRewrite.exe``. By default it needs [Ollama](https://ollama.com) with the model pulled once (``ollama pull qwen2.5:7b``); with no video card, Claude through the Anthropic API is the other engine (see the README). The exe is not code-signed yet, so Windows SmartScreen may ask you to confirm the first run.`n"
          [IO.File]::AppendAllText("$PWD/release-notes.md", $footer)

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build AiInlineRewrite.sln -c Release --nologo

      - name: Test
        run: dotnet test tests/AiInlineRewrite.Tests/AiInlineRewrite.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish (self-contained single file)
        run: dotnet publish src/AiInlineRewrite/AiInlineRewrite.csproj -p:PublishProfile=win-x64 --nologo

      - name: Zip
        shell: pwsh
        run: |
          $zip = "AiInlineRewrite-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path artifacts/publish/win-x64/AiInlineRewrite.exe, LICENSE, README.md -DestinationPath $zip
          "ZIP=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          body_path: release-notes.md
