name: release

# Tag a commit `vX.Y.Z` (the <Version> in src/AiInlineRewrite/AiInlineRewrite.csproj) to build the self-contained
# app folder and publish it as a GitHub Release whose notes are the CHANGELOG section of that version, with the zip,
# its SHA-256 checksum and a build provenance attestation. The Microsoft Store package (MSIX, tools/pack-msix.ps1) is
# built from the same folder and kept as a workflow artifact, for the Partner Center upload. Run by hand (workflow_dispatch), it is a rehearsal of the
# csproj's version: the same build, zip, checksum and attestation, kept as a workflow artifact, and no Release.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Version (the tag, or the csproj's on a rehearsal)
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          else {
            $csproj = [xml](Get-Content -Raw -Encoding UTF8 src/AiInlineRewrite/AiInlineRewrite.csproj)
            $tag = 'v' + @($csproj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0].Trim()
          }
          "TAG=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Release notes (the tag must name the version)
        shell: pwsh
        run: |
          ./tools/release-notes.ps1 -Tag $env:TAG -OutFile release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $footer = "`n---`n`nDownload ``AiInlineRewrite-$env:TAG-win-x64.zip`` below, unzip it anywhere and run ``AiInlineRewrite\AiInlineRewrite.exe``. On its first start it offers to download its model once (4.7 GB), or uses the one Ollama already has (``qwen2.5:7b``); Ollama and Claude through the Anthropic API are the other engines (see the README). The exe is not code-signed yet ([Code signing policy](https://github.com/$env:GITHUB_REPOSITORY/blob/main/CODE_SIGNING.md)), so Windows SmartScreen may ask you to confirm the first run. To check that the zip is the one this workflow built, see [Verifying a download](https://github.com/$env:GITHUB_REPOSITORY/blob/main/SECURITY.md#verifying-a-download).`n"
          [IO.File]::AppendAllText("$PWD/release-notes.md", $footer)

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Build
        run: dotnet build AiInlineRewrite.sln -c Release --nologo

      - name: Test
        run: dotnet test tests/AiInlineRewrite.Tests/AiInlineRewrite.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish (self-contained folder)
        run: dotnet publish src/AiInlineRewrite/AiInlineRewrite.csproj -p:PublishProfile=win-x64 --nologo

      - name: Zip and checksum
        shell: pwsh
        run: |
          $zip = "AiInlineRewrite-$env:TAG-win-x64.zip"
          New-Item -ItemType Directory -Force zip/AiInlineRewrite | Out-Null
          Copy-Item -Recurse artifacts/publish/win-x64/* zip/AiInlineRewrite
          Copy-Item LICENSE, README.md zip/AiInlineRewrite
          Compress-Archive -Path zip/AiInlineRewrite -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/$zip.sha256", "$hash  $zip`n")
          "ZIP=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build provenance attestation (the exe and the zip)
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/publish/win-x64/AiInlineRewrite.exe
            ${{ env.ZIP }}

      - name: Microsoft Store package (unsigned; the Store signs it)
        shell: pwsh
        run: |
          $identity = if ($env:STORE_IDENTITY_NAME) { $env:STORE_IDENTITY_NAME } else { 'rbritta.AIInlineRewrite.Test' }
          $publisher = if ($env:STORE_PUBLISHER) { $env:STORE_PUBLISHER } else { 'CN=AIR Test' }
          ./tools/pack-msix.ps1 -NoPublish -IdentityName $identity -Publisher $publisher -OutFile "AiInlineRewrite-$env:TAG-x64.msix"
        env:
          # Partner Center > the app > Product identity, as repository variables
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}

      - name: Keep the Store package
        uses: actions/upload-artifact@v7
        with:
          name: msix-${{ env.TAG }}
          path: AiInlineRewrite-${{ env.TAG }}-x64.msix

      - name: Keep the rehearsal's files
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-${{ env.TAG }}
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          body_path: release-notes.md
